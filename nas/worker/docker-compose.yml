# 나스 도우미 v3
# 수정: OPENBELL_URL, NAS_WORKER_TOKEN, (선택) TELEGRAM_*

services:
  nas-worker:
    build: .
    container_name: openbell-nas-worker
    restart: unless-stopped
    environment:
      OPENBELL_URL: "https://openbell-fawn.vercel.app"
      NAS_WORKER_TOKEN: "여기에_베셀과_같은_토큰"
      POLL_SECONDS: "15"
      HEADLESS: "1"
      PLAYWRIGHT_STATE_DIR: "/data"
      # 오픈벨 설정에 쓰는 텔레그램과 동일하게
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
    volumes:
      - openbell-worker-data:/data

volumes:
  openbell-worker-data:
