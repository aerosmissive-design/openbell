# 나스 도우미 v2 (Playwright)
# Container Manager → 이 폴더로 프로젝트 생성
#
# 수정 필수: OPENBELL_URL, NAS_WORKER_TOKEN

services:
  nas-worker:
    build: .
    container_name: openbell-nas-worker
    restart: unless-stopped
    environment:
      OPENBELL_URL: "https://openbell-fawn.vercel.app"
      NAS_WORKER_TOKEN: "여기에_베셀과_같은_토큰"
      POLL_SECONDS: "15"
      HEADLESS: "1"
      # DRY_RUN: "1"
