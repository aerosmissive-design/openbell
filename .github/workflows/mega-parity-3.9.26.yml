name: OpenBell 3.9.26 Megabox parity patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, repl, flags=0):
              p = Path(path); s = p.read_text(); n, s2 = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1: raise SystemExit(f'patch target not found: {path}: {pattern}')
              p.write_text(s2)

          sub('src/lib/cinema/megabox.server.ts', r'const days = Math\.min\(Math\.max\(input\?\.days \?\? 7, 1\), 14\);', 'const days = Math.min(Math.max(input?.days ?? 7, 1), 30);')
          sub('src/lib/cinema/scan-impl.server.ts', r'fetchMegaboxSeatmap\(\{ days: Math\.min\(days, 5\) \}\)', 'fetchMegaboxSeatmap({ days })')

          p = Path('src/lib/cinema/scan-impl.server.ts'); s = p.read_text()
          old = '''    let live = applySeatLayers(merged, [officialMap, nas.map, kt.map, relay.map, gasMap]);
    if (isCgvId(theater.theaterId) && extraNas.length) {
      live = applyReporterFallback(live, extraNas);
    }
    const nasSeatSource = nas.source === "nas423" ? "g-nas423" : nas.source === "nas225" ? "g-nas225" : nas.source === "nas" ? "g-nas" : "g-pc";
    const showtimes = applyCgvSeatHits(live, lastKnown, false, false).map((row) => {
      const liveSource =
        lookupSeatHit(row, officialMap) ? "official" :
        lookupSeatHit(row, nas.map) ? nasSeatSource :
        lookupSeatHit(row, kt.map) ? "cgv-kt" :
        lookupSeatHit(row, relay.map) ? "cgv-relay" :
        lookupSeatHit(row, gasMap) ? "gas-cache" :
        row.restSeats != null ? "last-known" : undefined;
      return ({
      ...row,
      playDate: normalizePlayDate(row.playDate),
      seatSource: liveSource,
    });
    });'''
          new = '''    const nasSeatSource = nas.source === "nas423" ? "g-nas423" : nas.source === "nas225" ? "g-nas225" : nas.source === "nas" ? "g-nas" : "g-pc";
    const live = applySeatLayersWithSource(merged, [
      { map: officialMap, source: "official" },
      { map: nas.map, source: nasSeatSource },
      { map: kt.map, source: "cgv-kt" },
      { map: relay.map, source: "cgv-relay" },
      { map: gasMap, source: "gas-cache" },
    ]);
    const showtimes = applyCgvSeatHits(live, lastKnown, false, false).map((row) => ({
      ...row,
      playDate: normalizePlayDate(row.playDate),
      seatSource: row.seatSource ?? (row.restSeats != null ? "last-known" : undefined),
    }));'''
          if old not in s: raise SystemExit('patch target not found: per-show seat block')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/lib/cinema/scan-impl.server.ts'); s = p.read_text()
          old = '''function applySeatLayers(rows: Showtime[], layers: SeatHitMap[]): Showtime[] {
  let out = rows;
  for (const layer of [...layers].reverse()) out = applyCgvSeatHits(out, layer, true);
  return out;
}'''
          new = '''function applySeatLayersWithSource(rows: Showtime[], layers: { map: SeatHitMap; source: string }[]): Showtime[] {
  return rows.map((row) => {
    for (const layer of layers) {
      const hit = lookupSeatHit(row, layer.map);
      if (!hit) continue;
      return { ...row, restSeats: hit.rest, totalSeats: hit.total ?? row.totalSeats, seatLive: true, seatCheckedAt: hit.at ? new Date(hit.at).toISOString() : row.seatCheckedAt ?? new Date().toISOString(), seatSource: layer.source };
    }
    return row;
  });
}'''
          if old not in s: raise SystemExit('patch target not found: seat resolver')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/components/watch-view.tsx'); s = p.read_text()
          old = '''                  <div className={cn(
                    "mt-0.5 flex min-w-0 items-center gap-1 whitespace-nowrap text-[10px]",
                    show.seatLive === false ? "text-muted" : "text-open",
                  )}>'''
          new = '''                  <div className="mt-0.5 flex min-w-0 items-center gap-1 whitespace-nowrap text-[10px] text-muted">'''
          if old not in s: raise SystemExit('patch target not found: source color')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/components/cinema-app.tsx'); s = p.read_text()
          if 'v3.9.25' in s: p.write_text(s.replace('v3.9.25', 'v3.9.26', 1))
          p = Path('.github/workflows/fix-version-header.yml'); s = p.read_text().replace('3.9.25', '3.9.26').replace('v3.9.24', 'v3.9.26'); p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/cinema/megabox.server.ts src/lib/cinema/scan-impl.server.ts src/components/watch-view.tsx src/components/cinema-app.tsx .github/workflows/fix-version-header.yml
          git commit -m "release: 3.9.26 megabox seat parity and source styling"
          git push
