name: fix-gpc-and-alert-links
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch G_PC matching and alert booking links
        shell: python
        run: |
          from pathlib import Path
          import re

          seats = Path('src/lib/cinema/seats.ts')
          s = seats.read_text(encoding='utf-8')
          old = '''function seatLookupKeys(row: Showtime): string[] {
            const titleKey = normalizeTitle(row.movieTitle);
            const siteNo = SITE_NO[row.theaterId] ?? "";
            const prefix = row.chain === "cgv" ? "k:" : "m:";
            const keys = [row.id];
            for (const clock of clockVariants(row.playDate, row.startTime)) {
              const stem = siteNo ? `${prefix}${siteNo}|${clock.playDate}|${clock.startTime}` : "";
              if (!stem) continue;
              for (const hall of hallVariants(row.hallName)) keys.push(`${stem}|${hall}`);
              if (titleKey) keys.push(`${stem}|${titleKey}`);
              if (row.movieNo) keys.push(`${stem}|${row.movieNo}`);
            }
            return [...new Set(keys.filter(Boolean))];
          }'''
          new = '''function seatLookupKeys(row: Showtime): string[] {
            const titleKey = normalizeTitle(row.movieTitle);
            const siteNo = SITE_NO[row.theaterId] ?? "";
            const prefix = row.chain === "cgv" ? "k:" : "m:";
            const keys = [row.id];
            const rowHalls = hallVariants(row.hallName);
            for (const clock of clockVariants(row.playDate, row.startTime)) {
              const stem = siteNo ? `${prefix}${siteNo}|${clock.playDate}|${clock.startTime}` : "";
              if (!stem) continue;
              // A show with a hall must only match that hall. Title/movieNo-only
              // keys are deliberately excluded here so another hall cannot mask
              // the PC/NAS reporter value.
              for (const hall of rowHalls) keys.push(`${stem}|${hall}`);
              if (!rowHalls.length) {
                if (titleKey) keys.push(`${stem}|${titleKey}`);
                if (row.movieNo) keys.push(`${stem}|${row.movieNo}`);
              }
            }
            return [...new Set(keys.filter(Boolean))];
          }'''
          if old not in s:
              raise SystemExit('seatLookupKeys target not found')
          seats.write_text(s.replace(old, new), encoding='utf-8')

          wt = Path('src/lib/cinema/watch-tick.server.ts')
          w = wt.read_text(encoding='utf-8')
          old_to = '''function toAlert(show: Showtime, all: Showtime[]): AlertItem {
            return {
              id: `alert:${show.id}:${Date.now()}`,
              createdAt: new Date().toISOString(),
              kind: "open",
              title: `${show.movieTitle} 예매 오픈`,
              body: showAlertBody(show, all),
              bookingUrl: show.bookingUrl,'''
          new_to = '''function resolveAlertBookingUrl(show: Showtime, all: Showtime[]): string {
            if (show.bookingUrl?.trim()) return show.bookingUrl.trim();
            const same = all.filter((candidate) =>
              candidate.theaterId === show.theaterId &&
              candidate.playDate === show.playDate &&
              candidate.startTime === show.startTime &&
              candidate.movieTitle === show.movieTitle &&
              candidate.hallName === show.hallName &&
              candidate.bookingUrl?.trim(),
            );
            if (same.length) return same[0].bookingUrl.trim();
            const cgvSite = show.theaterId === "cgv_yongsan" ? "0013" : show.theaterId === "cgv_yeongdeungpo" ? "0059" : "";
            if (cgvSite) {
              const date = String(show.playDate || "").replace(/-/g, "");
              return `https://cgv.co.kr/cnm/movieBook/cinema?siteNo=${cgvSite}&date=${date}`;
            }
            if (show.chain === "megabox") return "https://www.megabox.co.kr/booking";
            return "";
          }

          function toAlert(show: Showtime, all: Showtime[]): AlertItem {
            const bookingUrl = resolveAlertBookingUrl(show, all);
            return {
              id: `alert:${show.id}:${Date.now()}`,
              createdAt: new Date().toISOString(),
              kind: "open",
              title: `${show.movieTitle} 예매 오픈`,
              body: showAlertBody(show, all),
              bookingUrl,'''
          if old_to not in w:
              raise SystemExit('toAlert target not found')
          w = w.replace(old_to, new_to)
          old_items = '''    const items = [
      ...fresh.map((show) => toAlert(show, allShows)),
      ...changes.map((change) => seatChangeAlert(change, allShows)),
    ];'''
          new_items = '''    const items = [
      ...fresh.map((show) => toAlert(show, allShows)),
      ...changes.map((change) => {
        const bookingUrl = resolveAlertBookingUrl(change.show, allShows);
        return seatChangeAlert({ ...change, show: { ...change.show, bookingUrl } }, allShows);
      }),
    ];'''
          if old_items not in w:
              raise SystemExit('alert items target not found')
          w = w.replace(old_items, new_items)
          wt.write_text(w, encoding='utf-8')

          # Bump app version marker so the deployment clearly identifies this patch.
          Path('VERSION').write_text('3.9.25\n', encoding='utf-8')

      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/cinema/seats.ts src/lib/cinema/watch-tick.server.ts VERSION
          git commit -m "fix: restore strict G_PC matching and booking links" || exit 0
          git push
          rm -f .github/workflows/fix-gpc-and-alert-links.yml
          git add .github/workflows/fix-gpc-and-alert-links.yml
          git commit -m "chore: remove one-time patch workflow"
          git push
