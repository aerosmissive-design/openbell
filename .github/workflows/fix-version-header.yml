name: OpenBell patch runner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch helper
        run: python scripts/patch-settings-test-button.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/settings-view.tsx scripts/patch-settings-test-button.py
          if git diff --cached --quiet; then echo "No patch needed"; else git commit -m "feat: real reservation alert tests" && git push; fi
