name: Fix OpenBell version header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply OpenBell 3.9.26 patch
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/components/cinema-app.tsx': [
                  ('v3.9.24', 'v3.9.26'),
                  ('v3.9.25', 'v3.9.26'),
                  ('daysAhead: Math.min(Math.max(config.daysAhead || 7, 1), 14)', 'daysAhead: Math.min(Math.max(config.daysAhead || 7, 1), 30)'),
              ],
              'src/components/watch-view.tsx': [
                  ('show.seatLive === false ? "text-muted" : "text-open",', '"text-muted",'),
                  ('show.seatLive === false ? "text-muted" : "text-open",', '"text-muted",'),
              ],
              'src/lib/cinema/megabox.server.ts': [
                  ('const days = Math.min(Math.max(input?.days ?? 7, 1), 14);', 'const days = Math.min(Math.max(input?.days ?? 7, 1), 30);'),
              ],
              'src/lib/cinema/scan-impl.server.ts': [
                  ('fetchMegaboxSeatmap({ days: Math.min(days, 5) })', 'fetchMegaboxSeatmap({ days })'),
              ],
              'src/lib/cinema/seats.ts': [
                  ('''function seatLookupKeys(row: Showtime): string[] {
            const titleKey = normalizeTitle(row.movieTitle);
            const siteNo = SITE_NO[row.theaterId] ?? "";
            const prefix = row.chain === "cgv" ? "k:" : "m:";
            const keys = [row.id];
            for (const clock of clockVariants(row.playDate, row.startTime)) {
              const stem = siteNo ? `${prefix}${siteNo}|${clock.playDate}|${clock.startTime}` : "";
              if (!stem) continue;
              for (const hall of hallVariants(row.hallName)) keys.push(`${stem}|${hall}`);
              if (titleKey) keys.push(`${stem}|${titleKey}`);
              if (row.movieNo) keys.push(`${stem}|${row.movieNo}`);
            }
            return [...new Set(keys.filter(Boolean))];
          }''', '''function seatLookupKeys(row: Showtime): string[] {
            const titleKey = normalizeTitle(row.movieTitle);
            const siteNo = SITE_NO[row.theaterId] ?? "";
            const prefix = row.chain === "cgv" ? "k:" : "m:";
            const keys = [row.id];
            const rowHalls = hallVariants(row.hallName);
            for (const clock of clockVariants(row.playDate, row.startTime)) {
              const stem = siteNo ? `${prefix}${siteNo}|${clock.playDate}|${clock.startTime}` : "";
              if (!stem) continue;
              for (const hall of rowHalls) keys.push(`${stem}|${hall}`);
              if (!rowHalls.length) {
                if (titleKey) keys.push(`${stem}|${titleKey}`);
                if (row.movieNo) keys.push(`${stem}|${row.movieNo}`);
              }
            }
            return [...new Set(keys.filter(Boolean))];
          }''')
              ],
              'src/lib/cinema/watch-tick.server.ts': [
                  ('''function toAlert(show: Showtime, all: Showtime[]): AlertItem {
            return {
              id: `alert:${show.id}:${Date.now()}`,
              createdAt: new Date().toISOString(),
              kind: "open",
              title: `${show.movieTitle} 예매 오픈`,
              body: showAlertBody(show, all),
              bookingUrl: show.bookingUrl,''', '''function resolveAlertBookingUrl(show: Showtime, all: Showtime[]): string {
            if (show.bookingUrl?.trim()) return show.bookingUrl.trim();
            const same = all.filter((candidate) =>
              candidate.theaterId === show.theaterId &&
              candidate.playDate === show.playDate &&
              candidate.startTime === show.startTime &&
              candidate.movieTitle === show.movieTitle &&
              candidate.hallName === show.hallName &&
              candidate.bookingUrl?.trim(),
            );
            if (same.length) return same[0].bookingUrl.trim();
            const cgvSite = show.theaterId === "cgv_yongsan" ? "0013" : show.theaterId === "cgv_yeongdeungpo" ? "0059" : "";
            if (cgvSite) {
              const date = String(show.playDate || "").replace(/-/g, "");
              return `https://cgv.co.kr/cnm/movieBook/cinema?siteNo=${cgvSite}&date=${date}`;
            }
            if (show.chain === "megabox") return "https://www.megabox.co.kr/booking";
            return "";
          }

          function toAlert(show: Showtime, all: Showtime[]): AlertItem {
            const bookingUrl = resolveAlertBookingUrl(show, all);
            return {
              id: `alert:${show.id}:${Date.now()}`,
              createdAt: new Date().toISOString(),
              kind: "open",
              title: `${show.movieTitle} 예매 오픈`,
              body: showAlertBody(show, all),
              bookingUrl:'''),
                  ('''    const items = [
      ...fresh.map((show) => toAlert(show, allShows)),
      ...changes.map((change) => seatChangeAlert(change, allShows)),
    ];''', '''    const items = [
      ...fresh.map((show) => toAlert(show, allShows)),
      ...changes.map((change) => {
        const bookingUrl = resolveAlertBookingUrl(change.show, allShows);
        return seatChangeAlert({ ...change, show: { ...change.show, bookingUrl } }, allShows);
      }),
    ];''')
              ],
          }

          for name, pairs in replacements.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in pairs:
                  if old in s:
                      s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  print('patched', name)
              else:
                  print('unchanged', name)

          # Force the timestamp/source line to remain visually distinct from the seat count.
          p = Path('src/components/watch-view.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'className={cn(\n                    "mt-0.5 flex min-w-0 items-center gap-1 whitespace-nowrap text-[10px]",\n                    show.seatLive === false ? "text-muted" : "text-open",\n                  )}',
              'className="mt-0.5 flex min-w-0 items-center gap-1 whitespace-nowrap text-[10px] text-muted"',
          )
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cinema-app.tsx src/components/watch-view.tsx src/lib/cinema/megabox.server.ts src/lib/cinema/scan-impl.server.ts src/lib/cinema/seats.ts src/lib/cinema/watch-tick.server.ts
          if git diff --cached --quiet; then echo "No patch needed"; else git commit -m "fix: restore G_PC and booking links" && git push; fi
