name: Activate NAS seat source (priority + alerts)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch NAS priority, alerts, 30-day monitoring and seat source labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/lib/cinema/scan-impl.server.ts')
          s = p.read_text()
          if 'import { readNasSeatmap } from "./nas.server";' not in s:
              s = s.replace('import { fetchCgvKtSeatmap } from "./kt.server";\n', 'import { fetchCgvKtSeatmap } from "./kt.server";\nimport { readNasSeatmap } from "./nas.server";\n')
          marker = '  const ktSeats = [...wanted].some(isCgvId)'
          if 'const nasSeats =' not in s:
              block = '''  // 집 PC/NAS가 집 인터넷으로 CGV 공홈 잔여석을 읽어 올린 값. 공홈 다음 2순위.\n  const nasSeats = [...wanted].some(isCgvId)\n    ? readNasSeatmap([...wanted].filter(isCgvId)).catch(() => ({ map: {} as SeatHitMap, showtimes: [] as Showtime[], source: "pc" as const }))\n    : Promise.resolve({ map: {} as SeatHitMap, showtimes: [] as Showtime[], source: "pc" as const });\n'''
              s = s.replace(marker, block + marker)
          s = s.replace('const [catalog, cgvComing, seats, officialCgv, relay, kt, mega, gasList, ...theaters] =', 'const [catalog, cgvComing, seats, officialCgv, relay, nas, kt, mega, gasList, ...theaters] =')
          s = s.replace('      relaySeats,\n      ktSeats,', '      relaySeats,\n      nasSeats,\n      ktSeats,')
          if 'const extraNas =' not in s:
              s = s.replace('    const extraKt = isCgvId(theater.theaterId)', '    const extraNas = isCgvId(theater.theaterId)\n      ? nas.showtimes.filter((row) => row.theaterId === theater.theaterId)\n      : [];\n    const extraKt = isCgvId(theater.theaterId)')
          s = s.replace('const extra = [...extraGas, ...extraRelay, ...extraKt, ...extraOfficial];', 'const extra = [...extraGas, ...extraRelay, ...extraKt, ...extraNas, ...extraOfficial];')
          s = s.replace('applySeatLayers(merged, [officialMap, kt.map, relay.map, gasMap])', 'applySeatLayers(merged, [officialMap, nas.map, kt.map, relay.map, gasMap])')
          s = re.sub(r'(else if \(extraNas\.length\) source = "nas-report";\n\s*){2,}', 'else if (extraNas.length) source = "nas-report";\n      ', s)
          s = s.replace('maps: { official: SeatHitMap; kt: SeatHitMap; relay: SeatHitMap; gas: SeatHitMap }', 'maps: { official: SeatHitMap; nas: SeatHitMap; kt: SeatHitMap; relay: SeatHitMap; gas: SeatHitMap }')
          if 'const nas = score(maps.nas);' not in s:
              s = s.replace('const official = score(maps.official);\n  const kt = score(maps.kt);', 'const official = score(maps.official);\n  const nas = score(maps.nas);\n  const kt = score(maps.kt);')
          s = s.replace('if (official >= kt && official >= relay && official >= gas && official > 0) return "official";', 'if (official >= nas && official >= kt && official >= relay && official >= gas && official > 0) return "official";\n  if (nas >= kt && nas >= relay && nas >= gas && nas > 0) return "nas-report";')
          # Stamp the actual winning source on every showtime, not only at theater level.
          if 'const nasSeatSource = nas.source === "nas423"' not in s:
              needle = '    const showtimes = applyCgvSeatHits(live, lastKnown, false, false).map((row) => ({'
              repl = '''    const nasSeatSource = nas.source === "nas423" ? "g-nas423" : nas.source === "nas225" ? "g-nas225" : nas.source === "nas" ? "g-nas" : "g-pc";\n    const showtimes = applyCgvSeatHits(live, lastKnown, false, false).map((row) => {\n      const liveSource =\n        lookupSeatHit(row, officialMap) ? "official" :\n        lookupSeatHit(row, nas.map) ? nasSeatSource :\n        lookupSeatHit(row, kt.map) ? "cgv-kt" :\n        lookupSeatHit(row, relay.map) ? "cgv-relay" :\n        lookupSeatHit(row, gasMap) ? "gas-cache" :\n        row.restSeats != null ? "last-known" : undefined;\n      return ({'''
              s = s.replace(needle, repl)
              s = s.replace('      playDate: normalizePlayDate(row.playDate),\n    }));', '      playDate: normalizePlayDate(row.playDate),\n      seatSource: liveSource,\n    });\n    });', 1)
          p.write_text(s)

          t = Path('src/lib/cinema/types.ts')
          ts = t.read_text()
          if '  seatSource?: string;\n' not in ts:
              ts = ts.replace('  seatCheckedAt?: string | null;\n};', '  seatCheckedAt?: string | null;\n  seatSource?: string;\n};', 1)
          t.write_text(ts)

          w = Path('src/lib/cinema/watch-tick.server.ts')
          ws = w.read_text()
          ws = ws.replace('    totalSeats: show.totalSeats,\n  };\n}\n\nfunction canNotify', '    totalSeats: show.totalSeats,\n    seatSource: show.seatSource,\n  };\n}\n\nfunction canNotify')
          w.write_text(ws)

          a = Path('src/lib/cinema/seats.ts')
          ss = a.read_text()
          ss = ss.replace('    totalSeats: change.show.totalSeats,\n  };\n}\n\nexport function notifyBatches', '    totalSeats: change.show.totalSeats,\n    seatSource: change.show.seatSource,\n  };\n}\n\nexport function notifyBatches')
          a.write_text(ss)

          av = Path('src/components/alerts-view.tsx')
          avs = av.read_text()
          old = '''          <p className="mt-1 text-xs text-faint">\n            {alert.hallName}\n            {alert.formats.length\n              ? ` · ${alert.formats.map(formatLabel).join(" · ")}`\n              : ""}\n            {alert.restSeats != null\n              ? ` · ${alert.restSeats}${alert.totalSeats != null ? "/" + alert.totalSeats : ""}`\n              : ""}\n          </p>'''
          new = '''          <p className="mt-1 text-xs text-faint">\n            {alert.hallName}\n            {alert.formats.length\n              ? ` · ${alert.formats.map(formatLabel).join(" · ")}`\n              : ""}\n            {alert.restSeats != null\n              ? ` · ${alert.restSeats}${alert.totalSeats != null ? "/" + alert.totalSeats : ""}`\n              : ""}\n            {alert.seatSource ? ` · ${alert.seatSource === "g-nas423" ? "G_NAS423" : alert.seatSource === "g-nas225" ? "G_NAS225" : alert.seatSource === "g-nas" ? "G_NAS" : alert.seatSource === "g-pc" || alert.seatSource === "nas-report" ? "G_PC" : alert.seatSource === "cgv-kt" ? "KT 우회조회" : alert.seatSource === "cgv-relay" ? "CGV 우회조회" : alert.seatSource === "gas-cache" ? "구글 스크립트" : alert.seatSource === "official" ? "극장 공홈" : alert.seatSource}` : ""}\n          </p>'''
          if old in avs:
              avs = avs.replace(old, new)
          av.write_text(avs)

          wv = Path('src/components/watch-view.tsx')
          wvs = wv.read_text()
          wvs = wvs.replace('import { CHART_SIZE } from "@/lib/cinema/types";', 'import { CHART_SIZE, seatSourceLabel } from "@/lib/cinema/types";')
          marker = '''                    {seatFreshnessLabel(show) ? (\n                      <span\n                        className={\n                          show.seatLive === false\n                            ? "ml-1 text-[10px] text-muted"\n                            : "ml-1 text-[10px] text-open"\n                        }\n                      >\n                        {seatFreshnessLabel(show)}\n                      </span>\n                    ) : null}'''
          replacement = marker + '''\n                    {show.seatSource && seatSourceLabel(show.seatSource) !== "없음" ? (\n                      <span className="ml-1 text-[10px] text-muted">\n                        · {seatSourceLabel(show.seatSource)}\n                      </span>\n                    ) : null}'''
          if marker in wvs and 'seatSourceLabel(show.seatSource)' not in wvs:
              wvs = wvs.replace(marker, replacement, 1)
          wv.write_text(wvs)

          # The monitoring horizon is 5/7/10/15/30 days everywhere in the settings UI.
          settings = Path('src/components/settings-view.tsx')
          st = settings.read_text()
          st = st.replace('{[5, 7, 10, 15, 20].map((n) => (', '{[5, 7, 10, 15, 30].map((n) => (', 1)
          settings.write_text(st)

          # Bump the app version to 3.9.25.
          v = Path('VERSION')
          v.write_text('3.9.25\n')
          PY
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION src/lib/cinema/scan-impl.server.ts src/lib/cinema/types.ts src/lib/cinema/watch-tick.server.ts src/lib/cinema/seats.ts src/components/alerts-view.tsx src/components/watch-view.tsx src/components/settings-view.tsx
          if git diff --cached --quiet; then echo "No patch needed"; else git commit -m "release: 3.9.25 with 30-day monitoring and seat source labels" && git push; fi
