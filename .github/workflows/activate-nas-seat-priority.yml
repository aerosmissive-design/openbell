name: OpenBell 3.9.26 release patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Megabox seat parity, source styling and version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'patch target not found: {label}')
              p.write_text(s.replace(old, new, 1))

          # Megabox seat lookup uses the same configured 1..30 day horizon as CGV.
          replace_once(
              'src/lib/cinema/megabox.server.ts',
              'const days = Math.min(Math.max(input?.days ?? 7, 1), 14);',
              'const days = Math.min(Math.max(input?.days ?? 7, 1), 30);',
              'megabox 30-day cap',
          )
          replace_once(
              'src/lib/cinema/scan-impl.server.ts',
              'fetchMegaboxSeatmap({ days: Math.min(days, 5) })',
              'fetchMegaboxSeatmap({ days })',
              'megabox scan horizon',
          )

          # Resolve seat data independently for every showtime, in the same source order as CGV.
          p = Path('src/lib/cinema/scan-impl.server.ts')
          s = p.read_text()
          start = s.find('    let live = applySeatLayers(')
          end = s.find('    let source = theater.source;', start)
          if start < 0 or end < 0:
              raise SystemExit('per-show seat resolution block not found')
          new_block = '''    const nasSeatSource = nas.source === "nas423" ? "g-nas423" : nas.source === "nas225" ? "g-nas225" : nas.source === "nas" ? "g-nas" : "g-pc";
    const live = applySeatLayersWithSource(merged, [
      { map: officialMap, source: "official" },
      { map: nas.map, source: nasSeatSource },
      { map: kt.map, source: "cgv-kt" },
      { map: relay.map, source: "cgv-relay" },
      { map: gasMap, source: "gas-cache" },
    ]);
    const showtimes = applyCgvSeatHits(live, lastKnown, false, false).map((row) => ({
      ...row,
      playDate: normalizePlayDate(row.playDate),
      seatSource: row.seatSource ?? (row.restSeats != null ? "last-known" : undefined),
    }));
'''
          s = s[:start] + new_block + s[end:]

          # Replace the generic layer applicator with a per-show resolver that stops at the first source with a hit.
          start = s.find('function applySeatLayers(')
          end = s.find('function applyReporterFallback', start)
          if start < 0 or end < 0:
              raise SystemExit('seat layer helper not found')
          helper = '''function applySeatLayersWithSource(rows: Showtime[], layers: { map: SeatHitMap; source: string }[]): Showtime[] {
  return rows.map((row) => {
    for (const layer of layers) {
      const hit = lookupSeatHit(row, layer.map);
      if (!hit) continue;
      return {
        ...row,
        restSeats: hit.rest,
        totalSeats: hit.total ?? row.totalSeats,
        seatLive: true,
        seatCheckedAt: hit.at ? new Date(hit.at).toISOString() : row.seatCheckedAt ?? new Date().toISOString(),
        seatSource: layer.source,
      };
    }
    return row;
  });
}

'''
          s = s[:start] + helper + s[end:]
          p.write_text(s)

          # Date/source line must use a color distinct from the seat-count color.
          p = Path('src/components/watch-view.tsx')
          s = p.read_text()
          old = '''                  <div className={cn(
                    "mt-0.5 flex min-w-0 items-center gap-1 whitespace-nowrap text-[10px]",
                    show.seatLive === false ? "text-muted" : "text-open",
                  )}>'''
          new = '''                  <div className="mt-0.5 flex min-w-0 items-center gap-1 whitespace-nowrap text-[10px] text-muted">'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Header and persistent version patch workflow.
          p = Path('src/components/cinema-app.tsx')
          s = p.read_text().replace('v3.9.25', 'v3.9.26', 1)
          p.write_text(s)
          p = Path('.github/workflows/fix-version-header.yml')
          s = p.read_text().replace('3.9.25', '3.9.26').replace('v3.9.24', 'v3.9.26')
          p.write_text(s)
          Path('VERSION').write_text('3.9.26\n')

          # Restore the intended monitoring choices if an earlier patch left 20 days behind.
          p = Path('src/components/settings-view.tsx')
          s = p.read_text().replace('{[5, 7, 10, 15, 20].map((n) => (', '{[5, 7, 10, 15, 30].map((n) => (', 1)
          p.write_text(s)

          # Remove failed one-shot patch workflows; this existing workflow is now the persistent release patcher.
          for f in ['.github/workflows/patch-3.9.26.yml', '.github/workflows/mega-parity-3.9.26.yml']:
              q = Path(f)
              if q.exists(): q.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch needed"
          else
            git commit -m "release: 3.9.26 megabox seat parity and source styling"
            git push
          fi
