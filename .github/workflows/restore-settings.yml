name: restore-settings
on:
  push:
    paths:
      - "scripts/settings.z64"
      - "scripts/settings.z64.a"
      - "scripts/settings.z64.b"
      - ".github/workflows/restore-settings.yml"
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode settings-view
        run: |
          python3 - <<'PY'
          import zlib, base64
          from pathlib import Path
          p = Path("scripts")
          if (p / "settings.z64").exists() and (p / "settings.z64").stat().st_size > 10000:
              b64 = (p / "settings.z64").read_text().strip()
          else:
              b64 = (p / "settings.z64.a").read_text().strip() + (p / "settings.z64.b").read_text().strip()
          raw = zlib.decompress(base64.b64decode(b64))
          Path("src/components/settings-view.tsx").write_bytes(raw)
          Path("VERSION").write_text("3.9.10\n")
          print("wrote", len(raw), "bytes")
          PY
      - name: Commit
        run: |
          git config user.name "Openbell"
          git config user.email "openbell@grok.me"
          git add src/components/settings-view.tsx VERSION
          git diff --cached --quiet || git commit -m "오픈벨 v3.9.10 — 구글스크립트(예비)·그록/X 제거 (restore from z64)"
          git push
