name: OpenBell practical improvement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-openbell-improvement]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply practical fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
            p=Path(path); s=p.read_text()
            if old not in s: raise SystemExit(f'missing {path}: {old[:80]}')
            p.write_text(s.replace(old,new,1))
          rep('src/routes/api/seat-report.ts','type SeatRow = { playDate?: string; startTime?: string; hallName?: string; movieTitle?: string; movieNo?: string; restSeats?: number; totalSeats?: number };','type SeatRow = { playDate?: string; startTime?: string; hallName?: string; movieTitle?: string; movieNo?: string; bookingUrl?: string; scnsNo?: string; scnSseq?: string; restSeats?: number; totalSeats?: number };')
          rep('src/routes/api/seat-report.ts','const totalSeats = Number(r.totalSeats); out.push({ playDate, startTime, hallName, movieTitle, movieNo: r.movieNo ? String(r.movieNo) : "", restSeats, totalSeats: Number.isFinite(totalSeats) ? totalSeats : restSeats });','const totalSeats = Number(r.totalSeats); out.push({ playDate, startTime, hallName, movieTitle, movieNo: r.movieNo ? String(r.movieNo) : "", bookingUrl: r.bookingUrl ? String(r.bookingUrl).trim() : "", scnsNo: r.scnsNo ? String(r.scnsNo).trim() : "", scnSseq: r.scnSseq ? String(r.scnSseq).trim() : "", restSeats, totalSeats: Number.isFinite(totalSeats) ? totalSeats : restSeats });')
          rep('src/components/cinema-app.tsx','const enabledTheaters = useMemo(\n    () => THEATERS.map((t) => t.id),\n    [],\n  );','const enabledTheaters = useMemo(\n    () => THEATERS.filter((t) => config.theaters?.[t.id] !== false).map((t) => t.id),\n    [config.theaters],\n  );')
          rep('src/components/watch-view.tsx','const enabledTheaters = THEATERS;','const enabledTheaters = THEATERS.filter((theater) => config.theaters?.[theater.id] !== false);')
          rep('src/components/watch-view.tsx','<div className="flex flex-col gap-3">\n      {theaterRows.map(({ theater, result, shows }) => (','<div className="grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-4">\n      {theaterRows.map(({ theater, result, shows }) => (')
          for p in [Path('README.md'),Path('src/components/cinema-app.tsx')]:
            s=p.read_text().replace('v3.9.22','v3.9.27').replace('v3.9.26','v3.9.27')
            p.write_text(s)
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts: continue
            try: s=p.read_text()
            except (UnicodeDecodeError,OSError): continue
            if 'openbell-fawn.vercel.app' in s: p.write_text(s.replace('https://openbell-fawn.vercel.app','https://openbell-holdhyun.vercel.app'))
          PY
          cat > src/components/board-view.tsx <<'EOF'
          import { useEffect, useMemo, useState } from "react";
          import { RefreshCw } from "lucide-react";
          import { useSession } from "better-auth/react";
          import { authEnabled } from "@/lib/auth/client";
          import { applyCgvSeatHits, mergeShowtimes, seatFreshnessLabel } from "@/lib/cinema/seats";
          import { pullTheaterSeats, scanCinema } from "@/lib/cinema/scan";
          import { THEATERS } from "@/lib/cinema/theaters";
          import type { Showtime, TheaterId } from "@/lib/cinema/types";
          import { useAppStore } from "@/lib/store";
          import { formatClock } from "@/lib/utils";
          const IDS: TheaterId[]=["cgv_yongsan","cgv_yeongdeungpo","megabox_coex","megabox_namyangju"];
          export function BoardView(){
            const {data:session,isPending}=useSession(); const config=useAppStore(s=>s.config); const [data,setData]=useState<Record<string,Showtime[]>>({}); const [at,setAt]=useState<string|null>(null); const [busy,setBusy]=useState(true);
            const enabled=useMemo(()=>IDS.filter(id=>config.theaters?.[id]!==false),[config.theaters]);
            async function refresh(){setBusy(true);try{const [scan,seats]=await Promise.all([scanCinema({data:{theaters:enabled,daysAhead:Math.min(Math.max(config.daysAhead||7,1),20),gasWebUrl:config.gasWebUrl||undefined,mode:"full",sources:{official:true,naver:true,gas:Boolean(config.gasWebUrl)}}}),pullTheaterSeats({url:config.gasWebUrl.trim()||undefined,daysAhead:Math.min(Math.max(config.daysAhead||7,1),20),fresh:true})]);const next:Record<string,Showtime[]>={};for(const t of scan.theaters){const merged=mergeShowtimes(t.showtimes,seats.showtimes.filter(s=>s.theaterId===t.theaterId));next[t.theaterId]=applyCgvSeatHits(merged,seats.map,false,false).slice(0,18)}setData(next);setAt(new Date().toISOString())}finally{setBusy(false)}}
            useEffect(()=>{if(!authEnabled||session?.user)void refresh()},[enabled.join(","),config.daysAhead,config.gasWebUrl,session?.user?.id]);
            useEffect(()=>{if(authEnabled&&!session?.user)return;const id=window.setInterval(()=>void refresh(),60000);return()=>window.clearInterval(id)},[enabled.join(","),config.daysAhead,config.gasWebUrl,session?.user?.id]);
            if(authEnabled&&isPending)return <div className="min-h-dvh bg-bg p-8 text-muted">로그인 확인 중…</div>;
            if(authEnabled&&!session?.user)return <div className="min-h-dvh bg-bg p-8 text-fg"><h1 className="text-2xl font-bold">오픈벨 전광판</h1><p className="mt-3 text-muted">로그인 후 사용할 수 있습니다.</p><a className="mt-5 inline-block rounded-md bg-pick px-4 py-3" href="/">홈으로</a></div>;
            return <main className="min-h-dvh bg-bg px-4 py-5 text-fg md:px-6 lg:px-8"><header className="mx-auto mb-5 flex max-w-[1800px] items-end justify-between"><div><p className="text-xs tracking-[.18em] text-muted">OPENBELL BOARD</p><h1 className="mt-1 text-3xl font-bold md:text-4xl">예매 전광판</h1></div><button onClick={()=>void refresh()} className="flex items-center gap-2 rounded-md bg-surface px-3 py-2 text-sm"> <RefreshCw className={busy?"size-4 animate-spin":"size-4"}/>새로고침</button></header><div className="mx-auto grid max-w-[1800px] grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4">{IDS.filter(id=>enabled.includes(id)).map(id=>{const t=THEATERS.find(x=>x.id===id)!;return <section key={id} className="min-w-0 rounded-2xl bg-surface p-4 shadow-border md:p-5"><h2 className="mb-4 text-xl font-bold md:text-2xl">{t.shortName}</h2><div className="space-y-2">{(data[id]||[]).map(s=><a key={s.id} href={s.bookingUrl||"#"} target="_blank" rel="noreferrer" className="block rounded-xl bg-bg/60 p-3 ring-1 ring-border"><div className="flex justify-between gap-2"><b className="text-lg tabular-nums">{formatClock(s.startTime)}</b><span className="text-[11px] text-muted">{s.formats.includes("imax")||/IMAX/i.test(s.hallName)?"IMAX":s.hallName}</span></div><p className="mt-1 text-sm font-medium">{s.movieTitle}</p><div className="mt-2 flex justify-between text-xs"><b>잔여 {s.restSeats??"-"}석</b><span className="text-muted">{seatFreshnessLabel(s)||"확인 대기"}</span></div></a>)}</div></section>})}</div>{at&&<p className="mx-auto mt-4 max-w-[1800px] text-right text-xs text-muted">{formatClock(at)} 기준 · 60초 자동 갱신</p>}</main>;
          }
          EOF
          cat > src/routes/board.tsx <<'EOF'
          import { createFileRoute } from "@tanstack/react-router";
          import { BoardView } from "@/components/board-view";
          export const Route=createFileRoute("/board")({component:BoardView});
          EOF
      - name: Commit source changes first
        run: |
          git config user.name "openbell-bot"
          git config user.email "openbell-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: practical board and booking-link preservation [skip-openbell-improvement]"
          git push
      - name: Validation
        continue-on-error: true
        run: npm install --no-audit --no-fund && npm run typecheck && npm run build
