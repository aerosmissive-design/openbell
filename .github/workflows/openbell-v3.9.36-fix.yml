name: OpenBell v3.9.36 fix
on:
  push:
    branches:
      - openbell-v3.9.36-fix-20260917
permissions:
  contents: write
jobs:
  fix-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply v3.9.36 fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          write('VERSION','3.9.36\n')
          p='README.md'; s=read(p); s=re.sub(r'^# 오픈벨 \(Openbell\) v\d+\.\d+\.\d+','# 오픈벨 (Openbell) v3.9.36',s,count=1,flags=re.M); write(p,s)
          p='src/lib/cinema/types.ts'; s=read(p); old='export type ScanResult = { scannedAt: string; playDates: string[]; ranking: RankingMovie[]; showing: RankingMovie[]; catalog: RankingMovie[]; catalogNote?: string; theaters: TheaterScan[] };'; new='export type ScanResult = { scannedAt: string; playDates: string[]; ranking: RankingMovie[]; showing: RankingMovie[]; catalog: RankingMovie[]; catalogNote?: string; theaters: TheaterScan[]; seatSourceTimes?: Record<string, Record<string, string>> };'; assert old in s; write(p,s.replace(old,new,1))
          p='src/lib/cinema/seats.ts'; s=read(p); start=s.index('export function mergeShowtimes('); end=s.index('\nfunction betterBookingUrl',start); fn='''export function mergeShowtimes(primary: Showtime[], extra: Showtime[] = []): Showtime[] {\n  if (!extra.length) return primary;\n  const out = [...extra];\n  for (const row of primary) {\n    const index = out.findIndex((candidate) => sameShowtime(row, candidate));\n    if (index < 0) { out.push(row); continue; }\n    const prev = out[index];\n    out[index] = { ...prev, ...row, restSeats: row.restSeats ?? prev.restSeats, totalSeats: row.totalSeats ?? prev.totalSeats, bookingUrl: betterBookingUrl(row.bookingUrl, prev.bookingUrl), movieNo: row.movieNo || prev.movieNo, seatLive: row.restSeats != null ? (row.seatLive ?? true) : prev.seatLive, seatCheckedAt: row.seatCheckedAt ?? prev.seatCheckedAt };\n  }\n  return out;\n}\nfunction sameShowtime(a: Showtime, b: Showtime): boolean {\n  if (a.theaterId !== b.theaterId || a.playDate !== b.playDate || normTime(a.startTime) !== normTime(b.startTime) || !hallsMatch(a.hallName, b.hallName)) return false;\n  const ai = stableShowtimeId(a), bi = stableShowtimeId(b);\n  if (ai || bi) { if (ai && bi) return ai === bi; if (a.movieNo && b.movieNo) return a.movieNo === b.movieNo; return normalizeTitle(a.movieTitle) === normalizeTitle(b.movieTitle); }\n  if (a.movieNo && b.movieNo) return a.movieNo === b.movieNo;\n  return normalizeTitle(a.movieTitle) === normalizeTitle(b.movieTitle);\n}\nfunction stableShowtimeId(row: Showtime): string {\n  const url = String(row.bookingUrl || '');\n  const mega = url.match(/[?&]playSchdlNo=([^&#]+)/i)?.[1]; if (mega) return `mega:${decodeURIComponent(mega)}`;\n  const cgv = url.match(/[?&](?:scnSseq|scnsNo)=([^&#]+)/i)?.[1]; if (cgv) return `cgv:${decodeURIComponent(cgv)}`;\n  return row.movieNo ? `movie:${row.movieNo}` : '';\n}\n'''; write(p,s[:start]+fn+s[end:])
          p='src/lib/store.ts'; s=read(p); old='''      mergeOverlayShows: (theaterId, shows) =>\n        set((s) => ({\n          overlayShows: {\n            ...s.overlayShows,\n            [theaterId]: shows,\n          },\n        })),'''; new='''      mergeOverlayShows: (theaterId, shows) =>\n        set((s) => {\n          if (!shows.length) return s;\n          const previous = s.overlayShows[theaterId] ?? [];\n          const out = [...previous];\n          for (const row of shows) {\n            const index = out.findIndex((candidate) => candidate.theaterId === row.theaterId && candidate.playDate === row.playDate && candidate.startTime === row.startTime && candidate.hallName === row.hallName && (candidate.movieNo && row.movieNo ? candidate.movieNo === row.movieNo : candidate.movieTitle.trim().toLowerCase() === row.movieTitle.trim().toLowerCase()));\n            if (index < 0) out.push(row); else out[index] = { ...out[index], ...row, restSeats: row.restSeats ?? out[index].restSeats, totalSeats: row.totalSeats ?? out[index].totalSeats };\n          }\n          return { overlayShows: { ...s.overlayShows, [theaterId]: out } };\n        }),'''; assert old in s; write(p,s.replace(old,new,1))
          p='src/lib/cinema/scan-impl.server.ts'; s=read(p); s=s.replace('import { fetchMegaboxCatalog, fetchMegaboxSeatmap, fetchNaverMegabox } from "./megabox.server";','import { fetchMegaboxCatalog, fetchMegaboxSchedule, fetchMegaboxSeatmap, fetchNaverMegabox } from "./megabox.server";',1); old='const officialByDate = new Map<string, Showtime[]>(); const telePromise ='; new='const officialByDate = new Map<string, Showtime[]>(); const officialPromise = !fast && !isCgvId(theaterId) && sources.official ? Promise.all(playDates.map(async (date) => [date, await deadline(fetchMegaboxSchedule(theaterId as MegaboxId, date, { ignoreCircuit: true, timeoutMs: 8000 }), SCAN_DEADLINES.mega, [] as Showtime[])] as const)) : Promise.resolve([] as Array<readonly [string, Showtime[]]>); const telePromise ='; assert old in s; s=s.replace(old,new,1); old='const [naverByDate, teleByDate] = await Promise.all([naverPromise, telePromise]);'; new='const [naverByDate, officialRows, teleByDate] = await Promise.all([naverPromise, officialPromise, telePromise]); for (const [date, rows] of officialRows) if (rows.length) officialByDate.set(date, rows);'; assert old in s; s=s.replace(old,new,1); old='const primary = mergeShowtimes(officialByDate.get(date) ?? [], naverByDate.get(date) ?? []);'; new='const official = officialByDate.get(date) ?? []; const naver = naverByDate.get(date) ?? []; const primary = official.length ? official : naver;'; assert old in s; s=s.replace(old,new,1); a=s.index('export async function pingSeatmap('); b=s.index('\nasync function loadGasTimetable',a); block=s[a:b]; old='const cgvCount = keys.filter((key) => key.startsWith("k:") || key.startsWith("cgv:")).length; const status ='; new='const cgvCount = keys.filter((key) => key.startsWith("k:") || key.startsWith("cgv:")).length; const seatSourceTimes: Record<string, Record<string, string>> = {}; for (const theaterId of ["megabox_coex", "megabox_namyangju", "cgv_yongsan", "cgv_yeongdeungpo"] as TheaterId[]) seatSourceTimes[theaterId] = latestSeatSourceTimes(theaterId, [{ key: "official", map: { ...officialCgv.map, ...mega.map } }, { key: "relay", map: relay.map }, { key: "gas", map: gasMap }]); const status ='; assert old in block; block=block.replace(old,new,1); old='return { status, count: keys.length || extraShows.length, cgvCount, map, showtimes: extraShows };'; new='return { status, count: keys.length || extraShows.length, cgvCount, map, showtimes: extraShows, seatSourceTimes };'; assert old in block; block=block.replace(old,new,1); s=s[:a]+block+s[b:]; write(p,s)
          p='src/components/cinema-app.tsx'; s=read(p); s=s.replace('v3.9.35','v3.9.36',1); s=s.replace('seatSourceTimes: scan?.seatSourceTimes,','seatSourceTimes: mergeSeatSourceTimes(scan?.seatSourceTimes, seatQuery.data?.seatSourceTimes),',1); s=s.replace('[scan, catalogQuery.data, seatMap, overlayShows]);','[scan, catalogQuery.data, seatMap, overlayShows, seatQuery.data?.seatSourceTimes]);',1); marker='function mergeScanResults(fast: ScanResult | null, full: ScanResult | null): ScanResult | null {'; helper='''function mergeSeatSourceTimes(base?: ScanResult["seatSourceTimes"], extra?: ScanResult["seatSourceTimes"]): ScanResult["seatSourceTimes"] {\n  const out: NonNullable<ScanResult["seatSourceTimes"]> = { ...(base ?? {}) };\n  for (const [theaterId, times] of Object.entries(extra ?? {})) { const current = { ...(out[theaterId] ?? {}) }; for (const [key, value] of Object.entries(times ?? {})) { if (!current[key] || new Date(value).getTime() >= new Date(current[key]).getTime()) current[key] = value; } out[theaterId] = current; }\n  return out;\n}\n\n'''; assert marker in s; s=s.replace(marker,helper+marker,1); write(p,s)
          p='src/lib/cinema/seats.ts'; s=read(p); old='const text = `${subject}\\n\\n${items.map((a) => { const url = alertBookingUrl(a); const link = url ? `\\n바로 예매 ${url}` : ""; return `${a.title}\\n${a.body}${link}`; }).join("\\n\\n")}`;'; new='const rawText = `${subject}\\n\\n${items.map((a) => { const url = alertBookingUrl(a); const link = url ? `\\n바로 예매 ${url}` : ""; return `${a.title}\\n${a.body}${link}`; }).join("\\n\\n")}`; const text = rawText.length > 3900 ? `${rawText.slice(0, 3897)}...` : rawText;'; assert old in s; write(p,s.replace(old,new,1))
          PY
      - name: Commit v3.9.36 to main
        run: |
          rm -f .github/workflows/openbell-v3.9.36-fix.yml
          git config user.name 'aerosmissive-design'
          git config user.email 'aerosmissive@gmail.com'
          git add VERSION README.md src/lib/cinema/types.ts src/lib/cinema/seats.ts src/lib/cinema/scan-impl.server.ts src/lib/store.ts src/components/cinema-app.tsx
          git commit -m '오픈벨 v3.9.36 — 메가박스 시간표·조회시각·잔여석 병합 수정'
          git push origin HEAD:main
