if (primary.length) { showtimes.push(...primary); if (official.length) usedOfficial = true; else if (naver.length) usedNaver = true; continue; } if (stillMissing.includes(date)) { const tele = teleByDate.get(date); if (tele?.length) { showtimes.push(...tele); usedTele = true; continue; } } const gas = gasByDate.get(date); if (gas?.length) { showtimes.push(...gas); usedGas = true; } } const source = usedOfficial ? "official" : usedNaver ? "naver-place" : usedTele ? "yongsan-channel" : usedGas ? "gas-cache" : "none"; if (!showtimes.length) return { theaterId, ok: false, error: failMessage(theaterId, sources), showtimes: [], source, seatSource: "none" }; return { theaterId, ok: true, error: null, showtimes: normalizeShowtimes(showtimes), source, seatSource: "none" }; }'''; assert old in s; s=s.replace(old,new,1)
          a=s.index('export async function pingSeatmap('); b=s.index('\nasync function loadGasTimetable',a); new_ping='''export async function pingSeatmap(input: { url?: string; fresh?: boolean; theaterId?: TheaterId; daysAhead?: number }) { const days = Math.min(Math.max(input.daysAhead ?? 7, 1), 14); const fresh = Boolean(input.fresh); const wantMega = !input.theaterId || input.theaterId === "megabox_coex" || input.theaterId === "megabox_namyangju"; const wantCgv = !input.theaterId || input.theaterId === "cgv_yongsan" || input.theaterId === "cgv_yeongdeungpo"; const megaPromise = wantMega ? fetchMegaboxSeatmap({ theaterId: input.theaterId === "megabox_coex" || input.theaterId === "megabox_namyangju" ? input.theaterId : undefined, days: Math.min(days, 5), fresh }).catch(() => ({ map: {} as SeatHitMap, showtimes: [] as Showtime[] })) : Promise.resolve({ map: {} as SeatHitMap, showtimes: [] as Showtime[] }); const officialCgvPromise = wantCgv ? fetchCgvOfficialSeatmap({ theaterId: input.theaterId === "cgv_yongsan" || input.theaterId === "cgv_yeongdeungpo" ? input.theaterId : undefined, days: Math.min(days, 7), fresh }).catch(() => ({ map: {} as SeatHitMap, showtimes: [] as Showtime[] })) : Promise.resolve({ map: {} as SeatHitMap, showtimes: [] as Showtime[] }); const [mega, officialCgv] = await Promise.all([megaPromise, officialCgvPromise]); const megaHit = Object.keys(mega.map).length > 0 || mega.showtimes.some((row) => typeof row.restSeats === "number"); const cgvOfficialHit = Object.keys(officialCgv.map).length > 0 || officialCgv.showtimes.some((row) => typeof row.restSeats === "number"); const relay = wantCgv && !cgvOfficialHit ? await fetchCgvRelaySeatmap({ theaterId: input.theaterId === "cgv_yongsan" || input.theaterId === "cgv_yeongdeungpo" ? input.theaterId : undefined, days, fresh }).catch(() => ({ map: {} as SeatHitMap, showtimes: [] as Showtime[] })) : { map: {}, showtimes: [] as Showtime[] }; let gasMap: SeatHitMap = {}; let gasShows: Showtime[] = []; let gasStatus: "ok" | "old" | "denied" | "empty" | "badurl" | "timeout" = "empty"; if (input.url?.trim() && ((wantMega && !megaHit) || (wantCgv && !cgvOfficialHit))) { const live = await loadGasTimetable(input.url.trim(), days, input.theaterId).catch(() => [] as Showtime[]); if (live.length) { gasShows = live; for (const row of live) putSeatHit(gasMap, row); gasStatus = "ok"; } else { const gas = await loadGasSeatmap(input.url, fresh); gasMap = gas.map; gasStatus = gas.status; } } const map = { ...gasMap, ...relay.map, ...officialCgv.map, ...mega.map }; const extraShows = [...gasShows, ...relay.showtimes, ...officialCgv.showtimes, ...mega.showtimes]; const keys = Object.keys(map); const cgvCount = keys.filter((key) => key.startsWith("k:") || key.startsWith("cgv:")).length; const seatSourceTimes: Record<string, Record<string, string>> = {}; for (const theaterId of ["megabox_coex", "megabox_namyangju", "cgv_yongsan", "cgv_yeongdeungpo"] as TheaterId[]) seatSourceTimes[theaterId] = latestSeatSourceTimes(theaterId, [{ key: "official", map: { ...officialCgv.map, ...mega.map } }, { key: "cgv-relay", map: relay.map }, { key: "gas-cache", map: gasMap }]); const status = keys.length || extraShows.length ? ("ok" as const) : gasStatus; return { status, count: keys.length || extraShows.length, cgvCount, map, showtimes: extraShows, seatSourceTimes }; }\n'''; s=s[:a]+new_ping+s[b:]; write(p,s)
          p=Path('src/components/cinema-app.tsx'); s=read(p); s=s.replace('v3.9.35','v3.9.36'); s=s.replace('seatSourceTimes: scan?.seatSourceTimes,','seatSourceTimes: mergeSeatSourceTimes(scan?.seatSourceTimes, seatQuery.data?.seatSourceTimes),',1); s=s.replace('[scan, catalogQuery.data, seatMap, overlayShows]);','[scan, catalogQuery.data, seatMap, overlayShows, seatQuery.data?.seatSourceTimes]);',1); s=s.replace('text: mailCopy.text,','text: mailCopy.text.slice(0, 3900),',1); marker='function mergeScanResults(fast: ScanResult | null, full: ScanResult | null): ScanResult | null {'; helper='''function mergeSeatSourceTimes(base?: ScanResult["seatSourceTimes"], extra?: ScanResult["seatSourceTimes"]): ScanResult["seatSourceTimes"] { const out: NonNullable<ScanResult["seatSourceTimes"]> = { ...(base ?? {}) }; for (const [theaterId, times] of Object.entries(extra ?? {})) { const current={...(out[theaterId]??{})}; for (const [source,value] of Object.entries(times)) { const nextAt=Date.parse(value); const currentAt=current[source]?Date.parse(current[source]):0; if(!current[source] || (Number.isFinite(nextAt) && nextAt>=currentAt)) current[source]=value; } out[theaterId]=current; } return out; }\n\n'''; assert marker in s; s=s.replace(marker,helper+marker,1); write(p,s)
