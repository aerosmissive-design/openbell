          p=Path('src/lib/store.ts'); s=read(p); old='''      mergeOverlayShows: (theaterId, shows) =>\n        set((s) => ({\n          overlayShows: {\n            ...s.overlayShows,\n            [theaterId]: shows,\n          },\n        })),'''; new='''      mergeOverlayShows: (theaterId, shows) =>\n        set((s) => {\n          if (!shows.length) return s;\n          const previous = s.overlayShows[theaterId] ?? [];\n          const merged = mergeOverlayShowtimes(previous, shows);\n          return { overlayShows: { ...s.overlayShows, [theaterId]: merged } };\n        }),'''; assert old in s; s=s.replace(old,new,1); marker='export const useAppStore = create<AppState>()('; helper='''function mergeOverlayShowtimes(previous: Showtime[], next: Showtime[]): Showtime[] {\n  if (!previous.length) return next;\n  const out=[...previous];\n  for (const row of next) {\n    const index=out.findIndex((candidate)=>candidate.theaterId===row.theaterId && candidate.playDate===row.playDate && candidate.startTime===row.startTime && candidate.hallName===row.hallName && (candidate.movieNo && row.movieNo ? candidate.movieNo===row.movieNo : candidate.movieTitle.trim().toLowerCase()===row.movieTitle.trim().toLowerCase()));\n    if(index<0) out.push(row); else out[index]={...out[index],...row,restSeats:row.restSeats ?? out[index].restSeats,totalSeats:row.totalSeats ?? out[index].totalSeats};\n  }\n  return out;\n}\n\n'''; assert marker in s; s=s.replace(marker,helper+marker,1); write(p,s)
