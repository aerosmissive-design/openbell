name: Apply OpenBell UI fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Patch v3.9.27
        run: |
          if git log -1 --pretty=%s | grep -q '^오픈벨 v3.9.27 — FAST·FULL 좌석 결과 우선순위 수정$'; then
            echo "v3.9.27 patch commit already applied; nothing to do."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/cinema-app.tsx')
          s = p.read_text()
          old = '                v3.9.26'
          new = '                v3.9.27'
          if old in s:
              s = s.replace(old, new, 1)
          old = '    const showtimes = mergeShowtimes(fallback.showtimes, theater.showtimes);'
          new = '    const showtimes = mergeShowtimes(theater.showtimes, fallback.showtimes);'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('FAST/FULL merge line not found')
          p.write_text(s)
          PY

      - name: Typecheck
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

      - name: Commit fixes
        run: |
          if git log -1 --pretty=%s | grep -q '^오픈벨 v3.9.27 — FAST·FULL 좌석 결과 우선순위 수정$'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cinema-app.tsx
          git diff --cached --quiet && exit 0
          git commit -m "오픈벨 v3.9.27 — FAST·FULL 좌석 결과 우선순위 수정"
          git push origin main

      - name: Remove one-shot workflow
        run: |
          if git log -1 --pretty=%s | grep -q '^오픈벨 v3.9.27 — FAST·FULL 좌석 결과 우선순위 수정$'; then
            git rm .github/workflows/apply-openbell-ui-fixes.yml
            git commit -m "오픈벨 v3.9.27 — 일회성 수정 워크플로 정리"
            git push origin main
          fi
