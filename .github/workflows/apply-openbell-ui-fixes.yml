name: Apply OpenBell UI fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: startsWith(github.event.head_commit.message, 'chore: apply openbell ui fixes') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/cinema-app.tsx')
          s = p.read_text()
          old = '''  const enabledTheaters = useMemo(\n    () => THEATERS.map((t) => t.id),\n    [],\n  );'''
          new = '''  const enabledTheaters = useMemo(\n    () => THEATERS.filter((t) => config.theaters[t.id] !== false).map((t) => t.id),\n    [config.theaters],\n  );'''
          if old not in s:
              raise SystemExit('cinema-app enabledTheaters block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/components/watch-view.tsx')
          s = p.read_text()
          old = '  const enabledTheaters = THEATERS;'
          new = '  const enabledTheaters = THEATERS.filter((theater) => config.theaters[theater.id] !== false);'
          if old not in s:
              raise SystemExit('watch-view enabledTheaters block not found')
          s = s.replace(old, new, 1)

          old = '''      <div className="flex flex-col gap-3">\n      {theaterRows.map(({ theater, result, shows }) => ('''
          new = '''      <div className="grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-4">\n      {theaterRows.map(({ theater, result, shows }) => ('''
          if old not in s:
              raise SystemExit('watch-view theater container not found')
          s = s.replace(old, new, 1)

          s = s.replace('''        "rise-in flex flex-col overflow-hidden rounded-xl p-3 shadow-border transition-colors",''', '''        "rise-in flex min-w-0 flex-col overflow-hidden rounded-xl p-2.5 shadow-border transition-colors",''', 1)
          s = s.replace('''            <h2 className="truncate text-xl font-bold leading-tight text-fg">''', '''            <h2 className="truncate text-sm font-bold leading-tight text-fg">''', 1)
          s = s.replace('''          <FormatChips theaterId={theater.id} />''', '''          <div className="scale-[0.9] origin-top-left">\n            <FormatChips theaterId={theater.id} />\n          </div>''', 1)
          s = s.replace('''        <div className="mt-3 border-t border-border pt-3">''', '''        <div className="mt-2 border-t border-border pt-2 text-[11px]">''', 1)
          s = s.replace('''      <div className="mt-2 flex flex-col gap-2">''', '''      <div className="mt-1.5 flex flex-col gap-1">''', 1)
          s = s.replace('''        <h3 className="text-sm font-medium text-fg">{movie.title}</h3>''', '''        <h3 className="truncate text-[11px] font-semibold text-fg">{movie.title}</h3>''', 1)
          s = s.replace('''        <span className="text-[11px] tabular-nums text-muted">''', '''        <span className="text-[9px] tabular-nums text-muted">''', 1)
          s = s.replace('''        <div className="mt-2 flex flex-col gap-2">''', '''        <div className="mt-1 flex flex-col gap-1">''', 1)
          p.write_text(s)

          # Make the NAS local deployment explicitly LAN-accessible and document the control URL.
          p = Path('nas/docker-compose.yml')
          s = p.read_text()
          s = s.replace('''# 사용 방법 (Container Manager):\n# 1) 이 저장소를 나스에 받아 두기 (또는 nas 폴더만)\n# 2) Container Manager → 프로젝트 → 만들기\n# 3) 이 docker-compose.yml 선택\n# 4) 실행 후 브라우저에서 http://나스IP:3080''', '''# 사용 방법 (Container Manager):\n# 1) 이 저장소를 나스에 받아 두기 (또는 nas 폴더만)\n# 2) Container Manager → 프로젝트 → 만들기\n# 3) 이 docker-compose.yml 선택\n# 4) 실행 후 PC/폰에서 http://나스IP:3080 접속\n# 5) 같은 LAN에서는 이 웹 GUI에서 극장/감시 설정을 원격으로 변경할 수 있음\n#    외부망에서는 VPN/HTTPS를 사용하고 3080을 인터넷에 직접 공개하지 않는 것을 권장''')
          p.write_text(s)
          PY

      - name: Typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cinema-app.tsx src/components/watch-view.tsx nas/docker-compose.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply openbell ui fixes"
          git push origin main

      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/apply-openbell-ui-fixes.yml
          git commit -m "chore: remove one-shot ui fix workflow"
          git push origin main
