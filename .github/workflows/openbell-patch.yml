name: OpenBell one-time 3.9.24 patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'OpenBell 3.9.24 patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch OpenBell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/cinema-app.tsx')
          s=p.read_text()
          s=s.replace('v3.9.23','v3.9.24',1)
          old='''function toAlert(show: Showtime, all: Showtime[]): AlertItem {\n  return {'''
          new='''function toAlert(show: Showtime, all: Showtime[]): AlertItem {\n  const bookingUrl = resolveBookingUrl(show, all);\n  return {'''
          if old not in s: raise SystemExit('toAlert anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('    bookingUrl: show.bookingUrl,','    bookingUrl,',1)
          marker='''function queueNasJobs(items: AlertItem[], config: WatchConfig) {'''
          helper='''function resolveBookingUrl(show: Showtime, all: Showtime[]): string {\n  if (show.bookingUrl) return show.bookingUrl;\n  const normTime = (v: string) => String(v || '').replace(/\\D/g, '').padStart(4, '0').slice(-4);\n  const normTitle = (v: string) => normalizeTitle(v);\n  const same = all.find((row) =>\n    row !== show &&\n    row.theaterId === show.theaterId &&\n    row.playDate === show.playDate &&\n    normTime(row.startTime) === normTime(show.startTime) &&\n    normTitle(row.movieTitle) === normTitle(show.movieTitle) &&\n    Boolean(row.bookingUrl),\n  );\n  if (same?.bookingUrl) return same.bookingUrl;\n  if (show.chain === 'cgv') return 'https://www.cgv.co.kr/cnm/movieBook/cinema';\n  return show.chain === 'megabox' ? 'https://www.megabox.co.kr/booking' : '';\n}\n\n'''
          if marker not in s: raise SystemExit('queue marker missing')
          s=s.replace(marker,helper+marker,1)
          p.write_text(s)
          p=Path('src/lib/cinema/seats.ts')
          s=p.read_text()
          old='''  return [...map.values()];\n}\n\nexport function applyCgvSeatHits('''
          new='''  const loose = new Map<string, string[]>();\n  for (const [key] of map) {\n    const parts = key.split('|');\n    const looseKey = parts.slice(0, 4).join('|');\n    const list = loose.get(looseKey) ?? [];\n    list.push(key);\n    loose.set(looseKey, list);\n  }\n  for (const row of primary) {\n    const key = keyOf(row);\n    if (map.has(key)) continue;\n    const looseKey = [row.theaterId, row.playDate, normTime(row.startTime), normalizeTitle(row.movieTitle)].join('|');\n    const candidates = (loose.get(looseKey) ?? []).filter((k) => !map.get(k)?.bookingUrl);\n    if (candidates.length !== 1) continue;\n    const prevKey = candidates[0];\n    const prev = map.get(prevKey);\n    if (!prev) continue;\n    map.delete(prevKey);\n    map.set(key, {\n      ...prev,\n      ...row,\n      restSeats: row.restSeats ?? prev.restSeats,\n      totalSeats: row.totalSeats ?? prev.totalSeats,\n      bookingUrl: row.bookingUrl || prev.bookingUrl,\n      movieNo: row.movieNo || prev.movieNo,\n      seatLive: row.restSeats != null ? (row.seatLive ?? true) : prev.seatLive,\n      seatCheckedAt: row.seatCheckedAt ?? prev.seatCheckedAt,\n    });\n  }\n  return [...map.values()];\n}\n\nexport function applyCgvSeatHits('''
          if old not in s: raise SystemExit('seats merge anchor missing')
          s=s.replace(old,new,1)
          old='''  if (show.seatLive !== false) return "실시간";\n  if (!show.seatCheckedAt) return "마지막 확인";\n'''
          new='''  if (!show.seatCheckedAt) return "확인시각 없음";\n  const checked = new Date(show.seatCheckedAt);\n  if (!Number.isFinite(checked.getTime())) return "확인시각 없음";\n  const parts = new Intl.DateTimeFormat("ko-KR", {\n    timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false,\n  }).formatToParts(checked);\n  const get = (type: string) => parts.find((p) => p.type === type)?.value ?? "";\n  return `${Number(get("month"))}.${Number(get("day"))}일 ${get("hour")}:${get("minute")} 기준`;\n'''
          if old not in s: raise SystemExit('freshness anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'openbell-bot'
          git config user.email 'openbell-bot@users.noreply.github.com'
          git add src/components/cinema-app.tsx src/lib/cinema/seats.ts
          git commit -m 'OpenBell 3.9.24 patch' || exit 0
          git push
      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/openbell-patch.yml
          git add -u .github/workflows/openbell-patch.yml || true
          git commit -m 'Remove one-time patch workflow' || true
          git push || true
