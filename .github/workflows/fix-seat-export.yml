name: fix seat export
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix duplicate export
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/cinema/seats.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('export export export function alertBookingUrl', 'export function alertBookingUrl')
          s = s.replace('export export function alertBookingUrl', 'export function alertBookingUrl')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/cinema/seats.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: remove duplicate seat export"
          git push
