name: one time seat export repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair export modifier
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/lib/cinema/seats.ts')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'(?:export\s+)+function\s+alertBookingUrl', 'export function alertBookingUrl', s)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/cinema/seats.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: normalize booking url export"
          git push
