services:
  openbell-nas-reporter:
    build: .
    container_name: openbell-nas-reporter
    restart: unless-stopped
    environment:
      OPENBELL_URL: "https://openbell-fawn.vercel.app"
      NAS_REPORT_TOKEN: "여기에-베셀과-같은-토큰"
      THEATERS: "cgv_yongsan,cgv_yeongdeungpo"
      INTERVAL_MS: "60000"
      IMAX_INTERVAL_MS: "30000"
      DAYS: "2"
